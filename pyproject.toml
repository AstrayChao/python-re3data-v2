# ------------------------------------------------------------------------------
# Build system
# ------------------------------------------------------------------------------

[build-system]
build-backend = "hatchling.build"
requires = [
  "hatchling",
]

# ------------------------------------------------------------------------------
# Project
# ------------------------------------------------------------------------------

[project]
name = "python-re3data-v2"
version = "0.2.0"
description = "The Pythonic client for the re3data API (v40, schema 4.0)."
readme = "README.md"
keywords = [
  "api",
  "api-client",
  "metadata",
  "re3data",
  "repositories",
  "research data",
]
license = "MIT"
license-files = [ "LICENSE" ]
authors = [
  { name = "data-sync maintainers" },
]
requires-python = ">=3.14"
classifiers = [
  "Development Status :: 4 - Beta",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Text Processing :: Markup :: XML",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.28",
]

optional-dependencies.cli = [
  "typer>=0.16",
]
optional-dependencies.all = [
  "python-re3data-v2[cli]",
]

urls.Changelog = "https://github.com/AstrayChao/python-re3data-v2/blob/master/CHANGELOG.md"
urls.Repository = "https://github.com/AstrayChao/python-re3data-v2"
urls.Issues = "https://github.com/AstrayChao/python-re3data-v2/issues"
scripts.re3data = "re3data.__main__:app"

[dependency-groups]
dev = [
  "python-re3data-v2[all]",
  "ruff>=0.14",
]
test = [
  "pytest>=8.4",
]

# ------------------------------------------------------------------------------
# Tooling
# ------------------------------------------------------------------------------

[tool.hatch.build.targets.sdist]
only-include = [
  "src/re3data",
]

[tool.hatch.build.targets.wheel]
only-packages = true
packages = [
  "src/re3data",
]

[tool.ruff]
line-length = 120
src = [
  "src",
  "tests",
]

[tool.ruff.lint]
# schema 4.0 mirror models intentionally use the XML camelCase names as field names
extend-ignore = [
  "N803",  # argument name should be lowercase — schema mirror fields
  "N815",  # mixedCase variable in class scope — schema mirror fields
]
extend-select = [
  "A",   # flake8-builtins
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "I",   # isort
  "PERF", # perflint
  "PL",  # pylint
  "PT",  # flake8-pytest-style
  "RET", # flake8-return
  "RUF", # ruff
  "SIM", # flake8-simplify
  "UP",  # pyupgrade
]

[tool.ruff.lint.per-file-ignores]
"src/re3data/_resources/*.py" = [
  "D101", # undocumented-public-class — schema mirrors are documented by the XSD
  "D106", # undocumented-public-nested-class
]
"tests/**.py" = [
  "D",       # pydocstyle
  "PLR2004", # magic-value-comparison
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
  "-ra",
  "--showlocals",
  "--strict-markers",
  "--strict-config",
  "-m not e2e",
]
filterwarnings = [
  "error",
]
log_cli_level = "INFO"
testpaths = "tests"
markers = [
  "e2e: marks tests as end-to-end tests, requesting the live api",
]

[tool.coverage.run]
branch = true
source = [
  "re3data",
]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "@overload",
]
show_missing = true
